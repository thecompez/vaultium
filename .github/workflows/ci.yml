name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libssh2-1-dev sqlite3 gzip tar

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja pkg-config libssh2 sqlite
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVAULTIUM_BUILD_GUI=OFF
          -DVAULTIUM_BUILD_TESTS=ON
          -DVAULTIUM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  gui-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install llvm ninja pkg-config libssh2 sqlite qt
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure GUI
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-gui -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVAULTIUM_BUILD_GUI=ON
          -DVAULTIUM_BUILD_TESTS=OFF
          -DVAULTIUM_WARNINGS_AS_ERRORS=ON

      - name: Build GUI
        run: cmake --build build-gui --parallel
