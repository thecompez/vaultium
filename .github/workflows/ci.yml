name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libssh2-1-dev sqlite3 gzip tar

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja pkg-config libssh2 sqlite
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVAULTIUM_BUILD_GUI=OFF
          -DVAULTIUM_BUILD_TESTS=ON
          -DVAULTIUM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
